name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The wails package needs the native WebView headers to compile at all.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # main.go embeds frontend/dist, which is not committed, so the frontend
      # has to be built before any Go command touches the package.
      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: go vet ./...

      - run: go test -race ./...

      # Root package only: build/ios is framework scaffolding with no main,
      # so `go build ./...` fails there.
      - run: go build -o /dev/null .
